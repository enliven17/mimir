name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Committed secrets fail the build, across the whole history.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Critical advisories block; the remaining highs need major upgrades of
      # the Circle and wagmi stacks and are reported without blocking.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      - run: npm run compile:contract
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm run test:contract
      - run: npm run test:smoke
      - run: npm run build
        env:
          NEXT_PUBLIC_CONTRACT_ADDRESS: "0x50036154a3bc51f2e7d604a2fbc596f02bb555a1"
